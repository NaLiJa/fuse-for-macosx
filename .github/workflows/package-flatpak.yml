name: Package for Linux (Flatpak)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      # Packaging fixes can be applied to an existing tag without moving it.
      - name: Check out reviewed packaging instructions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve packaging manifest
        run: |
          mkdir -p "$RUNNER_TEMP/fusex-packaging"
          cp .github/builds/linux/org.speccytools.FuseX.json "$RUNNER_TEMP/fusex-packaging/"
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Apply reviewed packaging instructions to tagged source
        run: cp "$RUNNER_TEMP/fusex-packaging/org.speccytools.FuseX.json" .github/builds/linux/

      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: python3 fusepb/ci_scripts/release_version.py --tag "$RELEASE_TAG"

      - name: Build package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: FuseX-${{ inputs.version }}.flatpak
          manifest-path: .github/builds/linux/org.speccytools.FuseX.json
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Checksum Linux bundle
        run: sha256sum "FuseX-${{ inputs.version }}.flatpak" > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fusex-linux
          path: |
            FuseX-*.flatpak
            SHA256SUMS-linux.txt
          if-no-files-found: error
